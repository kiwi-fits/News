name: Jesus Hears You - Christian Devotional Reels Publisher

on:
  schedule:
    # Devotional Broadcasts every 20 minutes across 24 hours (:00, :20, :40 of every hour = 72 runs/day)
    - cron: '0,20,40 * * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Devotional Category'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - promise
          - wisdom
          - parable
          - mystery
          - prayer
      force:
        description: 'Force cycle execution even if daily target (72) is reached'
        required: false
        default: false
        type: boolean

concurrency:
  group: christian-reels-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-devotional:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository (with Git LFS Assets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Media Tools & Devotional Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-liberation \
            fonts-dejavu-core \
            fontconfig \
            ca-certificates
          fc-cache -fv

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Run Jesus Hears You Devotional Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHRISTIAN_FB_PAGE_ID: ${{ secrets.CHRISTIAN_FB_PAGE_ID }}
          CHRISTIAN_FB_ACCESS_TOKEN: ${{ secrets.CHRISTIAN_FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ENABLE_YOUTUBE_CHRISTIAN_PUBLISH: ${{ secrets.ENABLE_YOUTUBE_CHRISTIAN_PUBLISH }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CHRISTIAN_USE_VIDEO_BG: "true"
          CHRISTIAN_POST_INTERVAL_MINUTES: "20"
          CHRISTIAN_DAILY_TARGET: "72"
          VOICE_NAME: "en-US-ChristopherNeural"
          CHRISTIAN_VOICE_NAME: "en-US-ChristopherNeural"
        run: |
          CATEGORY="${{ github.event.inputs.category }}"
          FORCE="${{ github.event.inputs.force }}"
          if [ -z "$CATEGORY" ]; then
            CATEGORY="auto"
          fi
          ARGS="--category $CATEGORY"
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "✝️ Executing Jesus Hears You Publisher: $ARGS"
          python3 run_christian_cli.py $ARGS

      - name: Commit Updated Christian State & History
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clean up any leftover video binaries
          rm -rf generated/* || true

          git add christian_history.json christian_state.json christian_seen_verses.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "✝️ Update Jesus Hears You Devotional State & Deduplication Registry [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase -X ours origin main --quiet || true
              if git push origin main --quiet; then
                echo "✅ Successfully synced devotional state to GitHub!"
                break
              fi
              echo "⚠️ Push attempt $attempt failed, retrying..."
              sleep 3
            done
          fi
